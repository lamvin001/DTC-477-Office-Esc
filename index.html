<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- hitbox border  -->
     <div id="gameContainer" style="position: relative; display: inline-block;">
        <img id="gameImage" src="room1.png"
             onclick="handleClick(event.offsetX, event.offsetY)">
    </div>

    <!-- <img id="gameImage" src="room1.png" onclick="handleClick(event.offsetX, event.offsetY)"> -->
    

    <script>
        // Game State (memory)
        let currentState = "room1";
        let previousState = null;

        let inventory = [];

        let showHitboxes = true;

        let roomData = {
            room1: {
                keyTaken: false,
                doorUnlocked: false,
                clickables: [
                { name: "desk", x1: 290, x2: 900, y1: 375, y2: 680 },
                { name: "door", x1: 820, x2: 1000, y1: 130, y2: 540 },
                { name: "back", x1: 1200, x2: 1310, y1: 15, y2: 100 }
                ]
            },

            deskview: {
                clickables: [
                { name: "key", x1: 1000, x2: 1150, y1: 240, y2: 480 },
                { name: "back", x1: 1200, x2: 1310, y1: 15, y2: 100 }
                ]
            },

            room2: {
                clickables: []
            }
        };

        // Handle Click (input)
        function handleClick(x, y) {
            let room = currentState;
            let clickables = roomData[room].clickables;

            for (let i = 0; i < clickables.length; i++) {
                let obj = clickables[i];

                if (
                x > obj.x1 &&
                x < obj.x2 &&
                y > obj.y1 &&
                y < obj.y2
                ) {
                gameLogic({
                    room: room,
                    object: obj.name
                });
                return;
                }
            }
        }

        // Game Logic (decision)
        function gameLogic(clickData) {
            if (clickData.room === "room1") {

                if (clickData.object === "desk") {
                handleDesk();
                }

                if (clickData.object === "door") {
                handleDoor();
                }
            }

            if (clickData.room === "deskview") {

                if (clickData.object === "key") {
                handleItem();
                }

                if (clickData.object === "back") {
                currentState = "room1";
                updateScreen();
                }
            }
        }

        // Helper Functions (rules)
        function handleDesk() {
            previousState = currentState;
            currentState = "deskview";
            updateScreen();
            }

        function handleItem() {
            inventory.push("key");
            roomData.room1.keyTaken = true;
        }

        function handleDoor() {
            if (!roomData.room1.doorUnlocked) {

                if (inventory.includes("key")) {
                roomData.room1.doorUnlocked = true;
                console.log("Door unlocked!");
                } else {
                console.log("Door is locked!");
                }

            } else {
                previousState = currentState;
                currentState = "room2";
                updateScreen();
            }
        }

        // Draw Hitboxes
        function drawHitboxes() {
            if (!showHitboxes) return;

            const container = document.getElementById("gameContainer");

            // Remove old hitboxes
            const oldBoxes = document.querySelectorAll(".hitbox");
            oldBoxes.forEach(box => box.remove());

            let clickables = roomData[currentState].clickables;

            clickables.forEach(obj => {
                let box = document.createElement("div");
                box.className = "hitbox";

                box.style.position = "absolute";
                box.style.left = obj.x1 + "px";
                box.style.top = obj.y1 + "px";
                box.style.width = (obj.x2 - obj.x1) + "px";
                box.style.height = (obj.y2 - obj.y1) + "px";

                box.style.border = "2px solid red";
                box.style.pointerEvents = "none";

                container.appendChild(box);
            });
        }

        function updateScreen() {
            let img = document.getElementById("gameImage");

            if (currentState === "room1") {
                img.src = "img/room1.png";
            }

            if (currentState === "deskview") {
                img.src = "img/deskview.png";
            }

            if (currentState === "room2") {
                img.src = "img/room2.png";
            }
             drawHitboxes();
        }

        updateScreen();

    </script>
</body>
</html>
