<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Office Esc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --blood: #6b0f0f;
      --ash: #222;
      --green: #2d7a3a;
      --green2: #3aaa4e;
      --mono: 'Share Tech Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
      --serif: 'Crimson Pro', serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: var(--serif);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scene-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      z-index: 0;
    }

    .about-card {
      position: relative;
      z-index: 2;
      background: var(--blood);
      padding: 12px;
      max-width: 780px;
      width: 92%;
    }

    .about-inner {
      background: var(--ash);
      padding: 40px 48px 44px;
    }

    .about-title {
      font-family: var(--display);
      font-size: 4rem;
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 var(--blood), 4px 4px 0 #400;
      margin-bottom: 4px;
      text-align: center;
    }

    .about-sub {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--blood), transparent);
      margin-bottom: 28px;
    }

    .about-desc {
      font-size: 1.05rem;
      color: #ccc;
      line-height: 1.8;
      text-align: center;
      margin-bottom: 32px;
    }

    .credits-title {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: #555;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 16px;
    }

    .credits-grid {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .credit-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-top: 2px solid var(--blood);
      padding: 16px 22px;
      min-width: 140px;
      text-align: center;
    }

    .credit-name {
      font-family: var(--display);
      font-size: 1.6rem;
      color: #fff;
      letter-spacing: 2px;
    }

    .credit-role {
      font-family: var(--mono);
      font-size: 0.55rem;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .btn-back {
      display: block;
      width: fit-content;
      margin: 0 auto;
      background: var(--green);
      color: #fff;
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 44px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background .18s, transform .1s;
      text-decoration: none;
    }

    .btn-back:hover {
      background: var(--green2);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <img class="scene-bg" src="img/intro.png" alt="Background">

  <div class="about-card">
    <div class="about-inner">

      <div class="about-title">OFFICE ESC</div>
      <div class="about-sub">Point &amp; Click Escape Room</div>
      <div class="divider"></div>

      <p class="about-desc">
        A classic point-and-click escape room inspired by the Liminal Horror aesthetic.
        You've been locked inside an abandoned office building. Solve a puzzle in each
        room to find your brother and escape.
      </p>

      <div class="credits-title">— Credits —</div>
      <div class="credits-grid">
        <div class="credit-card">
          <div class="credit-name">Vincent</div>
          <div class="credit-role">Role</div>
        </div>
        <div class="credit-card">
          <div class="credit-name">Sonia</div>
          <div class="credit-role">Role</div>
        </div>
        <div class="credit-card">
          <div class="credit-name">Nakai</div>
          <div class="credit-role">Role</div>
        </div>
      </div>

      <button class="btn-back" onclick="window.history.back()">← Back to Game</button>

    </div>
  </div>

</body>
</html>
